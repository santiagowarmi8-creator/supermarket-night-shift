<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>SuperMarket Night Shift</title><style>*{box-sizing:border-box}body{margin:0;background:#090d19;color:white;font:600 14px system-ui;overflow:hidden}#game{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top);left:8px;right:8px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none}.chip{background:#111d35e8;border:1px solid #6e8ac0;border-radius:12px;padding:7px 10px;box-shadow:0 3px 12px #0008}#bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:12px;right:12px;background:#10192cde;border:1px solid #6886b6;border-radius:14px;padding:10px;text-align:center}#event{color:#ffb9a6;font-size:16px}#title{color:#ffdc77;font-weight:900}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="chip" id="title">🏪 NIGHT SHIFT AI</div><div class="chip" id="cash">💵 $250</div><div class="chip" id="day">🌙 Turno 1</div><div class="chip" id="level">⭐ Nivel 1</div><div class="chip" id="mission">🎯 Atender 10 clientes</div></div><div id="bottom"><div id="event">👁️ La tienda nunca cierra...</div><small>SIMULACIÓN AUTOMÁTICA • NO ES JUGABILIDAD HUMANA</small></div><script>
const c=document.querySelector('#game'),x=c.getContext('2d');let W=0,H=0,D=1,t=0,money=250,served=0,shift=1,level=1,goal=10,stock=30,customers=[],effects=[],eventText='👁️ La tienda nunca cierra...',eventUntil=0,spawn=0,blackout=0;const colors=['#ffb74d','#72e4c3','#bd9cff','#ff849d','#6abaff'];function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();const rand=(a,b)=>a+Math.random()*(b-a);function rect(a,b,w,h,col,r=0){x.fillStyle=col;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}function txt(s,a,b,sz=15,col='white'){x.fillStyle=col;x.font='bold '+sz+'px system-ui';x.textAlign='center';x.fillText(s,a,b)}function msg(s){eventText=s;eventUntil=t+380;document.querySelector('#event').textContent=s}function person(p){let xx=p.x*W,yy=p.y*H,scale=Math.max(.75,W/430);x.save();x.translate(xx,yy);x.scale(scale,scale);x.fillStyle='#0005';x.beginPath();x.ellipse(0,19,18,7,0,0,7);x.fill();rect(-11,-4,22,23,p.color,6);rect(-11,16,9,15,'#293f6b',3);rect(2,16,9,15,'#293f6b',3);if(!p.headless){x.fillStyle='#e5ad86';x.beginPath();x.arc(0,-13,12,0,7);x.fill();rect(-12,-23,24,8,'#3b2438',5);txt('•  •',0,-10,8,'#222')}else{rect(-5,-12,10,5,'#36121c',2);txt('?',0,-30,20,'#ff4b73')}x.restore()}function tick(){t++;if(t%45===0){spawn++;let evil=Math.random()<Math.min(.12+shift*.015,.35);customers.push({x:rand(.22,.78),y:1.06,color:colors[Math.floor(rand(0,colors.length))],headless:evil,progress:0,phase:0});if(evil)msg('🚨 ¡ENTRÓ UN CLIENTE SIN CABEZA!')}customers.forEach(p=>{p.progress++;if(p.phase===0){p.y-=.0038;if(p.y<.52){p.phase=1;p.progress=0}}else if(p.phase===1){if(p.progress>rand(65,90)){p.phase=2;p.progress=0;stock--;if(stock<5){stock=30;money-=35;msg('📦 Reposición automática: -$35')}}}else if(p.phase===2){p.x+=(.5-p.x)*.065;p.y+=(.30-p.y)*.06;if(Math.abs(p.y-.30)<.012){p.phase=3;p.progress=0}}else if(p.phase===3){if(p.progress>55){money+=p.headless?55:rand(9,24)|0;served++;p.phase=4;msg(p.headless?'👻 El cliente dejó dinero maldito...':'🛒 Venta completada automáticamente')}}else p.y-=.009});customers=customers.filter(p=>p.y>-.2);if(served>=goal){level++;goal+=10+level*3;money+=100;msg('🏆 ¡MISIÓN COMPLETADA! Nueva misión desbloqueada')}if(t%1600===0){shift++;msg('🌑 TURNO '+shift+' — LA TIENDA CAMBIA...')}if(t%650===0){const events=['📞 El teléfono suena desde el sótano...','🩸 Apareció una huella en el pasillo 3','👁️ Las cámaras detectaron una sombra','🚪 La puerta del almacén se abrió sola','🔦 Apagón: algo camina entre los estantes','📦 Encontraste una caja sin remitente','🧟 Los clientes olvidaron sus rostros'];msg(events[Math.floor(Math.random()*events.length)]);if(Math.random()<.3)blackout=t+130}document.querySelector('#cash').textContent='💵 $'+money;document.querySelector('#day').textContent='🌙 Turno '+shift;document.querySelector('#level').textContent='⭐ Nivel '+level;document.querySelector('#mission').textContent='🎯 Clientes '+served+'/'+goal;if(t>eventUntil)document.querySelector('#event').textContent='🛒 El supermercado funciona solo...'}
function draw(){const y=H*.18;x.fillStyle='#0b1427';x.fillRect(0,0,W,H);rect(0,y,W,H*.82,'#28324e');for(let i=0;i<20;i++){x.strokeStyle='#ffffff0b';x.beginPath();x.moveTo(0,y+i*H*.055);x.lineTo(W,y+i*H*.055);x.stroke()}rect(W*.08,y+H*.02,W*.84,H*.11,'#424f72',12);txt('SUPERMARKET',W*.5,y+H*.09,Math.min(27,W*.07),'#ffe5a1');for(let i=0;i<3;i++){let xx=W*(.08+i*.29);rect(xx,H*.43,W*.23,H*.27,'#121b30',8);rect(xx+4,H*.44,W*.23-8,H*.24,'#7383a3',5);for(let j=0;j<4;j++){rect(xx+8,H*(.46+j*.056),W*.18,7,'#243a5c',3);for(let k=0;k<3;k++)rect(xx+12+k*W*.055,H*(.44+j*.056),W*.034,15,colors[(i+j+k)%5],3)}}rect(W*.28,H*.25,W*.44,H*.095,'#e6a457',9);rect(W*.30,H*.26,W*.40,H*.06,'#4b3049',6);txt('💰 CAJA',W*.5,H*.302,15);rect(W*.08,H*.75,W*.84,H*.14,'#1b2944',12);txt('🚪 ENTRADA',W*.5,H*.83,17,'#a8dbff');customers.sort((a,b)=>a.y-b.y).forEach(person);if(t<blackout){x.fillStyle='rgba(0,0,0,.82)';x.fillRect(0,0,W,H);txt('⚠️ SIN ELECTRICIDAD',W*.5,H*.51,22,'#ff587a')}else if(t%550<8){x.fillStyle='#f33a';x.fillRect(0,0,W,H)}requestAnimationFrame(loop)}let last=0;function loop(ms){if(ms-last>33){tick();last=ms}draw()}requestAnimationFrame(loop);document.addEventListener('visibilitychange',()=>{if(!document.hidden)last=performance.now()});</script></body></html>
